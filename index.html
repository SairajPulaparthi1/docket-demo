<html lang="en">

<meta name="description" content="Docket: a personal, local-first ticket board. Live demo with sample data.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%234c9aff'/%3E%3Crect x='7' y='8' width='5' height='16' rx='1.5' fill='white'/%3E%3Crect x='13.5' y='8' width='5' height='11' rx='1.5' fill='white' opacity='.85'/%3E%3Crect x='20' y='8' width='5' height='7' rx='1.5' fill='white' opacity='.7'/%3E%3C/svg%3E">
<style>
:root {
  color-scheme: dark;
  --bg: #04060c; --panel: rgba(14,20,34,.78); --panel2: rgba(20,28,46,.86); --solid: #0c1220; --col: rgba(10,15,26,.55);
  --border: rgba(110,170,255,.13); --border2: rgba(110,170,255,.26);
  --text: #e4ecf8; --muted: #8796b0; --faint: #56637a;
  --accent: #3be6ff; --accent2: #a46bff; --accent-soft: rgba(59,230,255,.10); --hover: rgba(59,230,255,.07);
  --grad: linear-gradient(120deg, #3be6ff, #7b8cff 55%, #b46bff);
  --red: #ff5c7a; --red-soft: rgba(255,92,122,.13); --amber: #ffb547; --amber-soft: rgba(255,181,71,.13); --green: #2ef2a0; --green-soft: rgba(46,242,160,.12);
  --shadow: 0 0 0 1px var(--border), 0 6px 18px rgba(0,0,0,.35); --shadow-lg: 0 0 0 1px var(--border2), 0 24px 70px rgba(0,0,0,.65), 0 0 40px rgba(59,230,255,.06);
  --glow: 0 0 0 1px rgba(59,230,255,.55), 0 0 18px rgba(59,230,255,.28);
  --code: rgba(59,230,255,.07); --mono: "SF Mono", ui-monospace, "JetBrains Mono", Menlo, monospace;
  --grid: rgba(90,140,255,.045);
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #eef2f9; --panel: rgba(255,255,255,.86); --panel2: rgba(246,249,255,.95); --solid: #ffffff; --col: rgba(225,232,245,.6);
  --border: rgba(40,70,140,.13); --border2: rgba(40,70,140,.25);
  --text: #121a2c; --muted: #52607a; --faint: #8090a8;
  --accent: #0a84c9; --accent2: #7a3df0; --accent-soft: rgba(10,132,201,.10); --hover: rgba(10,132,201,.07);
  --grad: linear-gradient(120deg, #0aa6d6, #5468ff 55%, #8a3df0);
  --red: #d42f4f; --red-soft: #ffe8ec; --amber: #b56a00; --amber-soft: #fff1dc; --green: #0f9d63; --green-soft: #ddf8ec;
  --shadow: 0 0 0 1px var(--border), 0 4px 12px rgba(30,50,100,.08); --shadow-lg: 0 0 0 1px var(--border2), 0 20px 60px rgba(30,50,100,.25);
  --glow: 0 0 0 1px rgba(10,132,201,.5), 0 0 14px rgba(10,132,201,.2);
  --code: rgba(10,132,201,.07); --grid: rgba(40,80,160,.05);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif; display: flex; flex-direction: column; overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); }
.btn { background: var(--hover); border: 0; border-radius: 6px; padding: 6px 12px; font-weight: 500; white-space: nowrap; }
.btn:hover { filter: brightness(1.15); background: var(--border); }
.btn.primary { background: var(--accent); color: #fff; }
.btn.primary:hover { filter: brightness(1.08); background: var(--accent); }
.btn.ghost { background: transparent; } .btn.ghost:hover { background: var(--hover); }
.btn.danger { color: var(--red); }
.btn.sm { padding: 3px 8px; font-size: 12.5px; }
.icon-btn { background: transparent; border: 0; border-radius: 6px; width: 32px; height: 32px; display: inline-grid; place-items: center; color: var(--muted); }
.icon-btn:hover { background: var(--hover); color: var(--text); }
input[type=text], input[type=date], input[type=search], input[type=url], select, textarea {
  background: var(--panel); border: 1px solid var(--border2); border-radius: 6px; padding: 6px 9px; outline: none; }
input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
kbd { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; border: 1px solid var(--border2); border-radius: 4px; padding: 0 4px; color: var(--faint); }

/* ---------- top bar ---------- */
header { display: flex; align-items: center; gap: 14px; padding: 10px 18px; background: var(--panel); border-bottom: 1px solid var(--border); flex: none; }
.logo { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 16px; letter-spacing: -.2px; }
.logo svg { width: 24px; height: 24px; }
.tabs { display: flex; gap: 2px; }
.tab { background: transparent; border: 0; padding: 6px 11px; border-radius: 6px; color: var(--muted); font-weight: 500; }
.tab:hover { background: var(--hover); color: var(--text); }
.tab.on { color: var(--accent); background: var(--accent-soft); }
.search-wrap { position: relative; flex: 1; max-width: 520px; margin-left: auto; }
.search-wrap input { width: 100%; padding-left: 32px; padding-right: 44px; background: var(--panel2); }
.search-wrap .mag { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--faint); pointer-events: none; }
.search-wrap input:not(:placeholder-shown) ~ kbd { display: none; }
.search-wrap kbd { position: absolute; right: 9px; top: 50%; transform: translateY(-50%); }
.results { position: absolute; top: calc(100% + 6px); left: 0; right: 0; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; box-shadow: var(--shadow-lg); max-height: 70vh; overflow: auto; z-index: 40; display: none; }
.results.open { display: block; }
.res { padding: 9px 12px; border-bottom: 1px solid var(--border); cursor: pointer; }
.res:last-child { border-bottom: 0; }
.res:hover, .res.sel { background: var(--hover); }
.res .rt { display: flex; gap: 8px; align-items: center; font-weight: 500; }
.res .rm { font-size: 12.5px; color: var(--muted); margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.res .rm b { color: var(--faint); font-weight: 500; margin-right: 5px; }
.res mark { background: var(--amber-soft); color: inherit; border-radius: 2px; }
.res-empty { padding: 14px; color: var(--muted); }

/* ---------- filter bar ---------- */
.filters { display: flex; align-items: center; gap: 8px; padding: 10px 18px; flex: none; flex-wrap: wrap; }
.chip { border: 1px solid var(--border2); background: var(--panel); border-radius: 999px; padding: 3px 11px; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
.chip:hover { color: var(--text); }
.chip.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.filters select { padding: 3px 8px; font-size: 13px; border-radius: 999px; }
.filters .sep { width: 1px; height: 20px; background: var(--border); margin: 0 2px; }
.filters .count { margin-left: auto; color: var(--faint); font-size: 12.5px; }

main { flex: 1; overflow: auto; padding: 0 18px 18px; }

/* ---------- board ---------- */
.board { display: grid; grid-template-columns: repeat(5, minmax(240px, 1fr)); gap: 12px; min-height: 100%; align-items: start; }
.column { background: var(--col); border-radius: 8px; padding: 8px; display: flex; flex-direction: column; min-height: 200px; }
.col-h { display: flex; align-items: center; gap: 8px; padding: 4px 6px 10px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .4px; color: var(--muted); }
.col-h .n { background: var(--border); border-radius: 10px; padding: 0 7px; font-size: 11.5px; }
.col-h .add { margin-left: auto; width: 24px; height: 24px; }
.cards { display: flex; flex-direction: column; gap: 6px; flex: 1; min-height: 40px; border-radius: 6px; }
.cards.over { outline: 2px dashed var(--accent); outline-offset: 2px; }
.card { background: var(--panel); border-radius: 6px; padding: 9px 10px; box-shadow: var(--shadow); cursor: pointer; border-left: 3px solid var(--pc, transparent); }
.card:hover { background: var(--panel2); }
.card.dragging { opacity: .45; }
.card .ct { font-weight: 500; margin: 4px 0 7px; word-break: break-word; }
.card.done .ct { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--faint); }
.meta { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.meta .k { font-weight: 600; color: var(--faint); }
.meta .stat { display: inline-flex; gap: 3px; align-items: center; }
.drop-ph { height: 4px; border-radius: 2px; background: var(--accent); }
.col-more { text-align: center; font-size: 12.5px; color: var(--muted); padding: 6px; background: transparent; border: 0; }
.col-more:hover { color: var(--accent); }

.tp { width: 16px; height: 16px; border-radius: 3px; display: inline-grid; place-items: center; font-size: 10px; color: #fff; flex: none; font-weight: 700; }
.tp-task { background: #4c9aff; } .tp-bug { background: #e5493a; } .tp-note { background: #e2b203; } .tp-reference { background: #8f7ee7; } .tp-idea { background: #22a06b; }
.pr { font-weight: 700; font-size: 13px; line-height: 1; }
.pr-highest { color: #e5493a; } .pr-high { color: #fa8c3c; } .pr-medium { color: #e2b203; } .pr-low { color: #4c9aff; }
.lbl { background: var(--hover); border: 1px solid var(--border); border-radius: 4px; padding: 0 6px; font-size: 11.5px; color: var(--muted); }
.due { border-radius: 4px; padding: 0 6px; font-size: 11.5px; font-weight: 500; background: var(--hover); }
.due.over { background: var(--red-soft); color: var(--red); } .due.soon { background: var(--amber-soft); color: var(--amber); }
.pj { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600; color: var(--muted); }
.pj::before { content: ""; width: 7px; height: 7px; border-radius: 2px; background: var(--c); }
.status { display: inline-block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .3px; padding: 1px 6px; border-radius: 3px; background: var(--hover); color: var(--muted); }
.status.inprogress { background: var(--accent-soft); color: var(--accent); } .status.done { background: var(--green-soft); color: var(--green); } .status.blocked { background: var(--red-soft); color: var(--red); }

/* ---------- list / files ---------- */
table.grid { width: 100%; border-collapse: collapse; background: var(--panel); border-radius: 8px; overflow: hidden; box-shadow: var(--shadow); }
.grid th { text-align: left; font-size: 12px; font-weight: 600; color: var(--muted); padding: 9px 12px; border-bottom: 1px solid var(--border); cursor: pointer; user-select: none; white-space: nowrap; }
.grid th:hover { color: var(--text); }
.grid td { padding: 8px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.grid tr:last-child td { border-bottom: 0; }
.grid tbody tr { cursor: pointer; } .grid tbody tr:hover { background: var(--hover); }
.grid .t { font-weight: 500; }
.grid .dim { color: var(--muted); font-size: 12.5px; white-space: nowrap; }
.empty { text-align: center; color: var(--muted); padding: 60px 20px; }
.empty h3 { color: var(--text); margin: 0 0 6px; }

/* ---------- library ---------- */
.lib { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.note { background: var(--panel); border-radius: 8px; padding: 14px; box-shadow: var(--shadow); cursor: pointer; display: flex; flex-direction: column; gap: 8px; max-height: 260px; overflow: hidden; border-top: 3px solid var(--pc, var(--border)); }
.note:hover { background: var(--panel2); }
.note h4 { margin: 0; font-size: 15px; }
.note .body { color: var(--muted); font-size: 13px; overflow: hidden; flex: 1; -webkit-mask-image: linear-gradient(#000 70%, transparent); mask-image: linear-gradient(#000 70%, transparent); }
.note .body p { margin: 0 0 6px; }

/* ---------- drawer ---------- */
.scrim { position: fixed; inset: 0; background: rgba(9,30,66,.35); z-index: 50; display: none; }
.scrim.open { display: block; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(980px, 100vw); background: var(--panel); z-index: 51; box-shadow: var(--shadow-lg); transform: translateX(105%); transition: transform .18s ease; display: flex; flex-direction: column; }
.drawer.open { transform: none; }
.dh { display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-bottom: 1px solid var(--border); flex: none; }
.dh .key { font-weight: 600; color: var(--muted); font-size: 13px; }
.dh .sp { flex: 1; }
.dbody { flex: 1; overflow: auto; display: grid; grid-template-columns: minmax(0, 1fr) 260px; }
.dmain { padding: 18px 22px 40px; min-width: 0; }
.dside { padding: 18px 18px; border-left: 1px solid var(--border); background: var(--panel2); }
.title-in { width: 100%; font-size: 22px; font-weight: 600; border: 1px solid transparent; background: transparent; padding: 4px 6px; margin: 0 0 10px -7px; border-radius: 6px; resize: none; overflow: hidden; line-height: 1.3; }
.title-in:hover { background: var(--hover); }
.title-in:focus { background: var(--panel); }
.sec { margin-top: 22px; }
.sec-h { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 13.5px; margin-bottom: 8px; }
.sec-h .sp { flex: 1; }
.sec-h .n { color: var(--faint); font-weight: 500; }
.desc { border-radius: 6px; padding: 6px 8px; margin-left: -8px; min-height: 40px; cursor: text; }
.desc:hover { background: var(--hover); }
.desc.ph { color: var(--faint); }
textarea.ed { width: 100%; min-height: 160px; resize: vertical; font: 13.5px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
.ed-bar { display: flex; gap: 6px; margin-top: 6px; align-items: center; }
.ed-bar .hint { color: var(--faint); font-size: 12px; margin-left: auto; }
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
.field select, .field input { width: 100%; }
.field .ro { font-size: 12.5px; color: var(--muted); }
.lbl-edit { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; border: 1px solid var(--border2); border-radius: 6px; padding: 4px; background: var(--panel); }
.lbl-edit .lbl { display: inline-flex; gap: 4px; align-items: center; }
.lbl-edit .lbl button { border: 0; background: none; padding: 0; color: var(--faint); font-size: 13px; line-height: 1; }
.lbl-edit input { border: 0 !important; box-shadow: none !important; padding: 2px 4px; flex: 1; min-width: 60px; background: transparent; }

.check { display: flex; align-items: flex-start; gap: 8px; padding: 4px 6px; border-radius: 6px; margin-left: -6px; }
.check:hover { background: var(--hover); }
.check input[type=checkbox] { margin-top: 3px; accent-color: var(--accent); }
.check .tx { flex: 1; border: 0; background: transparent; padding: 0; }
.check.dn .tx { text-decoration: line-through; color: var(--muted); }
.check .x { visibility: hidden; }
.check:hover .x { visibility: visible; }
.progress { height: 5px; background: var(--border); border-radius: 3px; overflow: hidden; flex: 1; max-width: 160px; }
.progress > i { display: block; height: 100%; background: var(--green); }
.add-row { display: flex; gap: 6px; margin-top: 6px; }
.add-row input { flex: 1; }

.links .ln { display: flex; gap: 8px; align-items: center; padding: 4px 6px; margin-left: -6px; border-radius: 6px; }
.links .ln:hover { background: var(--hover); }
.links .ln a { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-decoration: none; }
.links .ln .u { color: var(--faint); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 40%; }

.drop { border: 1.5px dashed var(--border2); border-radius: 8px; padding: 14px; text-align: center; color: var(--muted); font-size: 13px; }
.drop.over { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.drop button { background: none; border: 0; color: var(--accent); padding: 0; text-decoration: underline; }
.files { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin-bottom: 10px; }
.file { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--panel); position: relative; }
.file .th { height: 92px; background: var(--panel2); display: grid; place-items: center; cursor: pointer; overflow: hidden; }
.file .th img { width: 100%; height: 100%; object-fit: cover; }
.file .th .ext { font-weight: 700; font-size: 13px; color: var(--muted); border: 1.5px solid var(--border2); border-radius: 5px; padding: 6px 8px; text-transform: uppercase; }
.file .fn { padding: 6px 8px 2px; font-size: 12.5px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.file .fs { padding: 0 8px 6px; font-size: 11.5px; color: var(--faint); display: flex; gap: 6px; }
.file .acts { position: absolute; top: 4px; right: 4px; display: none; gap: 2px; background: var(--panel); border-radius: 6px; box-shadow: var(--shadow); }
.file:hover .acts { display: flex; }
.file .acts button { width: 26px; height: 26px; }
.uploading { font-size: 12.5px; color: var(--muted); margin: 6px 0; }

.comment-box textarea { width: 100%; min-height: 70px; resize: vertical; }
.cm { display: flex; gap: 10px; margin-top: 14px; }
.cm .av { width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font-size: 12px; font-weight: 700; flex: none; }
.cm .cb { flex: 1; min-width: 0; }
.cm .when { font-size: 12px; color: var(--faint); }
.cm .when button { font-size: 12px; background: none; border: 0; padding: 0 0 0 8px; color: var(--faint); }
.cm .when button:hover { color: var(--red); }
.cm.sys { margin-top: 8px; align-items: center; font-size: 12.5px; color: var(--muted); }
.cm.sys .av { background: var(--border); color: var(--muted); width: 20px; height: 20px; font-size: 10px; margin: 0 4px; }

/* markdown */
.md { word-break: break-word; }
.md > :first-child { margin-top: 0; } .md > :last-child { margin-bottom: 0; }
.md p { margin: 0 0 8px; }
.md h1, .md h2, .md h3 { margin: 14px 0 6px; line-height: 1.25; } .md h1 { font-size: 19px; } .md h2 { font-size: 16.5px; } .md h3 { font-size: 14.5px; }
.md ul, .md ol { margin: 0 0 8px; padding-left: 22px; }
.md li.task { list-style: none; margin-left: -20px; }
.md code { font: 12.5px ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--code); padding: 1px 4px; border-radius: 3px; }
.md pre { background: var(--code); padding: 10px 12px; border-radius: 6px; overflow: auto; margin: 0 0 8px; }
.md pre code { background: none; padding: 0; font-size: 12.5px; }
.md blockquote { margin: 0 0 8px; padding-left: 10px; border-left: 3px solid var(--border2); color: var(--muted); }
.md hr { border: 0; border-top: 1px solid var(--border); margin: 12px 0; }
.md a.tk { font-weight: 600; text-decoration: none; }

/* ---------- modal ---------- */
.modal-bg { position: fixed; inset: 0; background: rgba(9,30,66,.45); z-index: 60; display: none; place-items: start center; padding-top: 10vh; }
.modal-bg.open { display: grid; }
.modal { background: var(--panel); border-radius: 10px; box-shadow: var(--shadow-lg); width: min(560px, calc(100vw - 32px)); padding: 20px 22px; max-height: 80vh; overflow: auto; }
.modal h2 { margin: 0 0 14px; font-size: 18px; }
.modal .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.modal .foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; align-items: center; }
.modal .foot .hint { margin-right: auto; color: var(--faint); font-size: 12px; }
.proj-row { display: grid; grid-template-columns: 40px 110px 1fr 32px; gap: 8px; align-items: center; margin-bottom: 6px; }
.proj-row input[type=color] { width: 40px; height: 32px; border: 1px solid var(--border2); border-radius: 6px; background: var(--panel); padding: 2px; }

.lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.85); z-index: 70; display: none; place-items: center; cursor: zoom-out; }
.lightbox.open { display: grid; }
.lightbox img { max-width: 92vw; max-height: 90vh; border-radius: 6px; }
.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%) translateY(80px); background: #172b4d; color: #fff; padding: 9px 16px; border-radius: 8px; z-index: 80; transition: transform .2s; font-size: 13.5px; box-shadow: var(--shadow-lg); }
.toast.show { transform: translateX(-50%); }

/* ================= neon-glass skin ================= */
.btn.claude { display: inline-flex; align-items: center; gap: 6px; background: var(--grad); color: #04101c; font: 700 11.5px/1 var(--mono); letter-spacing: 1px; text-transform: uppercase; padding: 8px 12px; box-shadow: 0 0 16px rgba(164,107,255,.4), inset 0 0 0 1px rgba(255,255,255,.25); margin-right: 6px; }
.btn.claude:hover { filter: brightness(1.12); box-shadow: 0 0 24px rgba(164,107,255,.6), inset 0 0 0 1px rgba(255,255,255,.35); background: var(--grad); }
.agent-preview { width: 100%; min-height: 150px; max-height: 260px; font: 12px/1.5 var(--mono); color: var(--muted); resize: vertical; }
.agent-note { font-size: 12.5px; color: var(--muted); margin: -4px 0 12px; }
.ac-chip { display: inline-block; font: 600 11px/1.6 var(--mono); letter-spacing: .4px; color: var(--accent2); border: 1px solid rgba(164,107,255,.45); border-radius: 6px; padding: 2px 8px; margin: -4px 0 4px; box-shadow: 0 0 10px rgba(164,107,255,.15); }
.ac-by { font: 500 11px/1 var(--mono); color: var(--muted); margin: -3px 0 7px; }

<script>
// Docket demo: an in-browser stand-in for the local Docket server.
// Every /api/* call the real UI makes is answered here from sample data kept in localStorage,
// so the board works on a static page with nothing uploaded anywhere.
(function () {
  'use strict';
  const KEY = 'docket-demo-v1';
  const STATUSES = ['backlog', 'todo', 'inprogress', 'blocked', 'done'];
  const STATUS_NAMES = { backlog: 'Backlog', todo: 'To Do', inprogress: 'In Progress', blocked: 'Blocked', done: 'Done' };
  const PRIORITIES = ['highest', 'high', 'medium', 'low'];
  const TYPES = ['task', 'bug', 'note', 'reference', 'idea'];
  const TEXT_EXT = new Set('txt md markdown log json csv tsv yaml yml xml html js ts py sh sql css conf ini toml'.split(' '));
  const IMG_EXT = new Set(['png', 'jpg', 'jpeg', 'gif', 'webp', 'svg']);
  const now = () => new Date().toISOString();
  const rid = () => Math.random().toString(36).slice(2, 10);
  const num = k => parseInt(String(k).split('-').pop(), 10) || 0;
  const ext = n => (String(n).split('.').pop() || '').toLowerCase();
  const MEM = {}; // session-only blobs for large uploads

  // ---------- sample data ----------

    const day = 864e5, t0 = Date.now();
    const at = d => new Date(t0 + d * day).toISOString();

    const ck = (text, done) => ({ id: rid(), text, done: !!done });
    const T = [];
    const add = (o) => { const n = T.length + 1; T.push(Object.assign({ key: 'DOC-' + n, title: '', type: 'task', status: 'todo', priority: 'medium', project: '', labels: [], due: '', description: '', checklist: [], links: [], comments: [], attachments: [], order: n, created: at(-20 + n), updated: at(-2), done_at: '' }, o)); };

    add({ title: 'Pick a new hosting provider', project: 'WEB', status: 'done', priority: 'high', labels: ['infra'], done_at: at(-5), created: at(-21),
      description: 'Compared three providers on price, uptime and support.\n\n**Decision:** go with the one that has staging environments built in.',
      comments: [c(-12, 'Shortlisted three. Pricing within $10/month of each other.'), c(-5, 'Status: In Progress → Done', true), c(-5, 'Signed up and moved DNS. Old host cancels at month end.')] });

      description: 'The current page has **too many plans** and people email us asking which one to pick.\n\n- Cut to two plans\n- Add a comparison table\n- Plain-language feature names\n\nCopy draft is attached; search finds words inside it.',
      checklist: [ck('Wireframes', 1), ck('Copy draft', 1), ck('Review with marketing'), ck('Ship it')],
      links: [{ url: 'https://example.com/pricing-research', title: 'Pricing page research notes' }],
      comments: [c(-4, 'Status: To Do → In Progress', true), c(-3, 'Wireframes approved. Going with two plans + FAQ.'), c(-1, 'Copy draft attached. Need marketing to sign off on the plan names.')],
      attachments: [{ name: 'pricing-copy.md', size: 612, added: at(-1), searchable: true }] });
    add({ title: 'Migrate old blog posts', project: 'WEB', status: 'blocked', priority: 'medium', labels: ['content'],
      description: 'About 140 posts on the old CMS. Need an export before we can import them.',
      comments: [c(-6, 'Status: To Do → Blocked', true), c(-6, 'Blocked: waiting on the old CMS vendor to send the export. Asked twice.')] });
    add({ title: 'App crashes on login on Android 14', project: 'APP', type: 'bug', status: 'todo', priority: 'highest', due: due(-1), labels: ['android', 'crash'],
      description: 'Reported by 12 users since the last release. Crash log attached. It happens right after the login button is tapped.',
      comments: [c(-2, 'Repro on a Pixel 8. Looks like a null token on cold start.')],
      attachments: [{ name: 'crash-log.txt', size: 840, added: at(-2), searchable: true }] });
    add({ title: 'Add dark mode', project: 'APP', status: 'todo', priority: 'medium', due: due(9), labels: ['ui'],
      description: 'Most requested feature in the last survey (38% of answers).',
      checklist: [ck('Pick the color tokens'), ck('Update all screens'), ck('Follow the system setting')] });
    add({ title: 'Offline mode for notes', project: 'APP', status: 'backlog', priority: 'low', labels: ['sync'],
      description: 'Let people read and edit notes without a connection, then sync when back online.' });

  const list = filtered().filter(t => F.type || !['note', 'reference'].includes(t.type));

    }

// drag & drop
let dragKey = null;
document.addEventListener('dragstart', e => {
  const c = e.target.closest?.('.card'); if (!c) return;
  dragKey = c.dataset.key; c.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', dragKey);
});
document.addEventListener('dragend', () => { $$('.card.dragging').forEach(c => c.classList.remove('dragging')); $$('.cards.over').forEach(c => c.classList.remove('over')); $$('.drop-ph').forEach(p => p.remove()); dragKey = null; });
function afterEl(container, y) {
  return $$('.card:not(.dragging)', container).find(c => { const r = c.getBoundingClientRect(); return y < r.top + r.height / 2; }) || null;
}
document.addEventListener('dragover', e => {
  if (!dragKey) return;
  const zone = e.target.closest?.('.column'); if (!zone) return;
  e.preventDefault();
  const cards = $('.cards', zone);
  $$('.cards.over').forEach(c => c !== cards && c.classList.remove('over')); cards.classList.add('over');
  let ph = $('.drop-ph') || Object.assign(document.createElement('div'), { className: 'drop-ph' });
  const after = afterEl(cards, e.clientY);
  if (after) cards.insertBefore(ph, after); else cards.appendChild(ph);

document.addEventListener('drop', e => {
  if (!dragKey) return;
  const zone = e.target.closest?.('.column'); if (!zone) return;
  e.preventDefault();
  const cards = $('.cards', zone), status = cards.dataset.status, ph = $('.drop-ph', cards);
  const prev = ph?.previousElementSibling?.closest('.card'), next = ph?.nextElementSibling?.closest('.card');
  const po = prev ? byKey(prev.dataset.key)?.order : null, no = next ? byKey(next.dataset.key)?.order : null;
  let order = po != null && no != null ? (po + no) / 2 : po != null ? po + 1 : no != null ? no - 1 : 0;
  const key = dragKey, t = byKey(key);
  if (t && prev?.dataset.key === key) return;
  if (t) { t.status = status; t.order = order; }
  save(key, { status, order });

// pending text saves (title / checklist edits) so nothing is lost on close
const pending = new Map();
function later(key, fields, ms = 600) {
  const p = pending.get(key) || { fields: {} };
  Object.assign(p.fields, fields); clearTimeout(p.h);
  p.h = setTimeout(() => { pending.delete(key); save(key, p.fields); }, ms);
  pending.set(key, p);
}
function flushPending() { for (const [key, p] of pending) { clearTimeout(p.h); save(key, p.fields); } pending.clear(); }

// ---------------- uploads ----------------
async function upload(key, files) {
  files = [...files]; if (!files.length) return;
  const st = $('#upStatus');
  for (let i = 0; i < files.length; i++) {
    const f = files[i];
    if (st) { st.hidden = false; st.textContent = `Uploading ${f.name} (${i + 1}/${files.length})…`; }
    try { const r = await api('POST', `/api/tickets/${key}/files?name=${encodeURIComponent(f.name)}`, undefined, f); upsert(r.ticket); }
    catch (e) { toast(`Upload failed: ${f.name}: ${e.message}`); }
  }
  const t = byKey(key); if (openKey === key && t) renderAttachments(t);
  render(); toast(files.length === 1 ? 'File attached' : `${files.length} files attached`);
}

// ---------------- search ----------------
let sTimer, sSel = -1, sHits = [];
function hl(text, q) {
  let h = esc(text);
  for (const term of q.toLowerCase().split(/\s+/).filter(Boolean)) {
    const re = new RegExp('(' + esc(term).replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig');
    h = h.replace(re, '<mark>$1</mark>');
  }
  return h;
}
async function runSearch() {
  const q = $('#q').value.trim(), box = $('#results');
  if (!q) { box.classList.remove('open'); return; }
  sHits = await api('GET', '/api/search?q=' + encodeURIComponent(q)).catch(() => []);
  sSel = sHits.length ? 0 : -1;
  const label = w => w.startsWith('content:') ? 'in ' + w.slice(8) : w.startsWith('file:') ? 'file' : w;
  box.innerHTML = sHits.length ? sHits.map((h, i) => `<div class="res${i === sSel ? ' sel' : ''}" data-key="${h.key}">
      <div class="rt">${typeIcon(h.type)}<span style="color:var(--faint);font-size:12.5px">${h.key}</span>${hl(h.title, q)}<span style="margin-left:auto"><span class="status ${h.status}">${SNAME[h.status]}</span></span></div>
      ${h.matches.filter(m => m.where !== 'title').slice(0, 2).map(m => `<div class="rm"><b>${esc(label(m.where))}</b>${hl(m.text, q)}</div>`).join('')}</div>`).join('')
    : `<div class="res-empty">No results for “${esc(q)}”. <a href="#" data-createfrom>Create a ticket with this title</a></div>`;
  box.classList.add('open');
}
function moveSel(d) {
  if (!sHits.length) return; sSel = (sSel + d + sHits.length) % sHits.length;
  $$('#results .res').forEach((r, i) => r.classList.toggle('sel', i === sSel)); $$('#results .res')[sSel]?.scrollIntoView({ block: 'nearest' });
}

// ---------------- new ticket ----------------
function openNew(preset = {}) {
  const f = $('#newForm'); f.reset();
  f.type.innerHTML = opts(TYPES, preset.type || 'task');
  f.project.innerHTML = projOpts(preset.project ?? F.project);
  f.status.innerHTML = opts(STATUSES, preset.status || 'todo');
  f.priority.innerHTML = opts(PRIOS, 'medium');
  if (preset.title) f.title.value = preset.title;
  $('#newModal').classList.add('open'); f.title.focus();
}
$('#newForm').addEventListener('submit', async e => {
  e.preventDefault();
  const fd = Object.fromEntries(new FormData(e.target));
  try {
    const t = await api('POST', '/api/tickets', fd); upsert(t);
    $('#newModal').classList.remove('open'); render(); openTicket(t.key); toast(`${t.key} created`);
  } catch (err) { toast('Create failed: ' + err.message); }
});
$('#newForm').addEventListener('keydown', e => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); $('#newForm').requestSubmit(); } });

// ---------------- send to Claude ----------------
let agentKey = null, agentTimer;
function openAgent(t) {
  agentKey = t.key;
  const p = proj(t.project);
  $('#agentFor').textContent = `${t.key} · ${t.title}`;
  $('#agentDir').value = (p && p.dir) || store.get('agentDir', '~/Desktop');
  $('#agentDirs').innerHTML = [...new Set([...board.projects.map(x => x.dir).filter(Boolean), store.get('agentDir', '')].filter(Boolean))].map(d => `<option value="${esc(d)}">`).join('');
  $('#agentExtra').value = '';
  $('#agentModal').classList.add('open');
  previewAgent();
}
async function previewAgent() {
  const q = new URLSearchParams({ dir: $('#agentDir').value, extra: $('#agentExtra').value });
  try { $('#agentPrompt').value = (await api('GET', `/api/tickets/${agentKey}/agent?${q}`)).prompt; } catch (e) { $('#agentPrompt').value = e.message; }
}

// ---------------- settings ----------------
function acStatus() {
  const a = board.imports || {};
  if (a.lastError && (!a.lastSync || a.lastErrorAt > a.lastSync)) return `⚠ Last sync failed: ${esc(a.lastError)}`;
  if (!a.lastSync) return 'Not synced yet.';
  const r = a.lastResult || {};
  return `Last sync ${ago(a.lastSync)}: ${r.open ?? 0} open request(s), ${Object.keys(a.imported || {}).length} linked ticket(s).`;
}
function openSettings() {
  const ps = board.projects;
  $('#setBody').innerHTML = `<h2>Settings</h2>
    <div class="sec-h">Projects</div><div class="agent-note" style="margin:0 0 8px">The folder is where “Send to Claude” starts the agent for that project's tickets.</div>
    <div id="projRows">${ps.map(p => projRow(p)).join('')}</div>
    <button class="btn sm" data-addproj>+ Add project</button>
    <div class="sec-h" style="margin-top:20px">Your data</div>
    <div style="color:var(--muted);font-size:13px;margin-bottom:8px">In the desktop app, everything is plain files on your Mac. In this demo, your changes are saved in this browser only, and nothing is uploaded anywhere.</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm" data-backup>Download my demo data</button><button class="btn sm" onclick="__docketDemoReset()">Reset demo</button></div>
    <div class="sec-h" style="margin-top:20px">Keyboard</div>
    <div style="color:var(--muted);font-size:13px;line-height:1.9"><kbd>C</kbd> create · <kbd>⌘K</kbd> or <kbd>/</kbd> search · <kbd>1</kbd>–<kbd>4</kbd> switch view · <kbd>Esc</kbd> close</div>
    <div class="foot"><button class="btn ghost" data-close>Cancel</button><button class="btn primary" data-saveproj>Save</button></div>`;
  $('#setModal').classList.add('open');
}
const projRow = p => `<div class="proj-row"><input type="color" value="${esc(p.color)}"><input type="text" value="${esc(p.key)}" placeholder="KEY" maxlength="12"><input type="text" value="${esc(p.name)}" placeholder="Name"><input type="text" value="${esc(p.dir || '')}" placeholder="Claude folder, e.g. ~/Desktop/repo" spellcheck="false"><button class="icon-btn" data-rmproj title="Remove">×</button></div>`;

// Never fail silently: surface any uncaught error from a handler.
window.addEventListener('unhandledrejection', e => toast('Something went wrong: ' + (e.reason?.message || e.reason)));
window.addEventListener('error', e => toast('Something went wrong: ' + e.message));

// ---------------- events ----------------
document.addEventListener('click', async e => {
  const el = e.target.closest('button, [data-key], [data-editdesc], a, [data-fview]'); if (!el) {
    if (!e.target.closest('.search-wrap')) $('#results').classList.remove('open'); return; }
  const d = el.dataset;
  if (!el.closest('.search-wrap')) $('#results').classList.remove('open');

  if (el.matches('a.tk')) { e.preventDefault(); openTicket(el.getAttribute('href').slice(1)); return; }
  if (el.classList.contains('tab')) { view = d.view; render(); return; }
  if ('proj' in d) { F.project = d.proj; render(); return; }
  if ('app' in d) { F.app = d.app; render(); return; }
  if ('clear' in d) { F = Object.assign(F, view === 'imports' ? { app: '', type: '', priority: '', label: '' } : { project: '', source: '', type: '', priority: '', label: '' }); render(); return; }
  if ('alldone' in d) { F.showAllDone = !F.showAllDone; render(); return; }
  if ('add' in d) { openNew({ status: d.add }); return; }
  if ('newnote' in d) { openNew({ type: 'note', status: 'backlog' }); return; }
  if ('sort' in d) { sort = sort.k === d.sort ? { k: d.sort, dir: -sort.dir } : { k: d.sort, dir: 1 }; store.set('sort', sort); render(); return; }
  if ('fopen' in d || 'freveal' in d) { e.stopPropagation(); await api('POST', `/api/tickets/${d.fkey}/files/${encodeURIComponent(d.fopen || d.freveal)}?do=${'fopen' in d ? 'open' : 'reveal'}`); return; }
  if ('close' in d) { el.closest('.modal-bg')?.classList.remove('open'); if (el.closest('#drawer')) closeDrawer(); return; }
  if ('agentcopy' in d) { await previewAgent(); navigator.clipboard?.writeText($('#agentPrompt').value); toast('Brief copied: paste it into Claude'); return; }
  if ('agentgo' in d) {
    el.disabled = true;
    try {
      const r = await api('POST', `/api/tickets/${agentKey}/agent`, { dir: $('#agentDir').value, extra: $('#agentExtra').value });
      store.set('agentDir', $('#agentDir').value); upsert(r); $('#agentModal').classList.remove('open'); render();
      if (openKey === r.key) renderDrawer(r);
      toast(`Claude is starting on ${r.key} in Terminal`);
    } catch (err) { toast(err.message); } finally { el.disabled = false; }
    return;
  }
  if ('createfrom' in d) { e.preventDefault(); const q = $('#q').value; $('#q').value = ''; $('#results').classList.remove('open'); openNew({ title: q }); return; }

  // settings modal
  if ('addproj' in d) { $('#projRows').insertAdjacentHTML('beforeend', projRow({ key: '', name: '', color: '#8c9bab' })); return; }
  if ('rmproj' in d) { el.closest('.proj-row').remove(); return; }
  if ('saveproj' in d) {
    const projects = $$('#projRows .proj-row').map(r => { const [c, k, n, dr] = $$('input', r); return { color: c.value, key: k.value.trim(), name: n.value.trim(), dir: dr.value.trim() }; }).filter(p => p.key);
    try { board = await api('PUT', '/api/board', { projects }); $('#setModal').classList.remove('open'); render(); toast('Projects saved'); } catch (err) { toast(err.message); }
    return;
  }
  if ('acsync' in d) {
    el.disabled = true; if ($('#acStatus')) $('#acStatus').textContent = 'Syncing…'; else el.textContent = 'Syncing…';
    try { const r = await api('POST', '/api/imports/sync'); await load(true); render(); toast(`Imports: ${r.created} new, ${r.updated} updated`); }
    catch (err) { toast('Imports sync failed: ' + err.message); await load(true); }
    finally { el.disabled = false; $('#acStatus') && ($('#acStatus').innerHTML = acStatus()); }
    return;
  }
  if ('revealdata' in d) { api('POST', '/api/reveal-data'); return; }
  if ('backup' in d) { try { const r = await api('POST', '/api/backup'); toast('Backup saved: ' + r.path.split('/').pop()); } catch (err) { toast('Backup failed: ' + err.message); } return; }

  // drawer actions
  const t = openKey && byKey(openKey);
  if (t && el.closest('#drawer')) {
    if ('agent' in d) { openAgent(t); return; }
    if ('copy' in d) { navigator.clipboard?.writeText(t.key); toast('Copied ' + t.key); return; }
    if ('del' in d) {
      if (!confirm(`Delete ${t.key} “${t.title}”?\n\nIt is moved to Docket's trash folder (data/trash) along with its files, not erased.`)) return;
      await api('DELETE', '/api/tickets/' + t.key); tickets = tickets.filter(x => x.key !== t.key); closeDrawer(); render(); toast(`${t.key} moved to trash`); return;
    }
    if ('editdesc' in d) { if (e.target.closest('a')) return; renderDesc(t, true); return; }
    if ('savedesc' in d) { const v = $('#dDescIn').value; const r = await save(t.key, { description: v }); renderDesc(r || t); return; }
    if ('canceldesc' in d) { renderDesc(t); return; }
    if ('crm' in d) { const id = el.closest('.check').dataset.cid; const r = await save(t.key, { checklist: t.checklist.filter(c => c.id !== id) }); r && renderChecklist(r); return; }
    if ('addlink' in d) { addLink(t); return; }
    if ('lrm' in d) { const links = t.links.filter((_, i) => i !== +d.lrm); const r = await save(t.key, { links }); r && renderLinks(r); return; }
    if ('pick' in d) { $('#filePick').click(); return; }
    if ('rmlabel' in d) { const r = await save(t.key, { labels: t.labels.filter(l => l !== d.rmlabel) }); r && renderDrawerSide(r); return; }
    if ('revealdir' in d) {
      if (t.attachments[0]) api('POST', `/api/tickets/${t.key}/files/${encodeURIComponent(t.attachments[0].name)}?do=reveal`); else toast('No files attached yet');
      return;
    }
    if ('addnote' in d) { addNote(t); return; }
    if ('cmrm' in d) {
      if (!confirm('Delete this note?')) return;
      const id = el.closest('.cm').dataset.cmid; const r = await save(t.key, { comments: t.comments.filter(c => c.id !== id) }); r && renderComments(r); return;
    }
    const fileEl = el.closest('.file');
    if (fileEl) {
      const name = fileEl.dataset.fname;
      if ('fo' in d) { api('POST', `/api/tickets/${t.key}/files/${encodeURIComponent(name)}?do=open`); return; }
      if ('fr' in d) { api('POST', `/api/tickets/${t.key}/files/${encodeURIComponent(name)}?do=reveal`); return; }
      if ('fd' in d) {
        if (!confirm(`Remove “${name}” from ${t.key}?\n\nThe file is moved to Docket's trash folder, not erased.`)) return;
        const r = await api('DELETE', `/api/tickets/${t.key}/files/${encodeURIComponent(name)}`); upsert(r); renderAttachments(r); render(); return;
      }
      if ('fview' in d) {
        if (isImg(name)) { $('#lightbox img').src = fileURL(t.key, name); $('#lightbox').classList.add('open'); }
        else window.open(fileURL(t.key, name), '_blank');
        return;
      }
    }
    return;
  }

  // search result / card / row
  if (d.key && !el.closest('#drawer')) { $('#results').classList.remove('open'); openTicket(d.key); }
});

async function addLink(t) {
  let url = $('#lUrl').value.trim(); const title = $('#lTitle').value.trim();
  if (!url) return; if (!/^[a-z]+:\/\//i.test(url)) url = 'https://' + url;
  const r = await save(t.key, { links: [...t.links, { url, title }] }); r && renderLinks(r);
}
async function addNote(t) {
  const ta = $('#dNote'), text = ta.value.trim(); if (!text) return;
  try { const r = await api('POST', `/api/tickets/${t.key}/comments`, { text }); upsert(r); ta.value = ''; renderComments(r); render(); }
  catch (err) { toast('Could not save note: ' + err.message); }
}

document.addEventListener('change', async e => {
  const el = e.target;
  if (el.closest('#filters') && el.dataset.f) { F[el.dataset.f] = el.value; render(); return; }
  if (el.id === 'filePick') { if (openKey) upload(openKey, el.files); el.value = ''; return; }
  const t = openKey && byKey(openKey); if (!t || !el.closest('#drawer')) return;
  if (el.dataset.field) {
    const r = await save(t.key, { [el.dataset.field]: el.value });
    if (r && ['type', 'project', 'status'].includes(el.dataset.field)) { renderDrawer(r); }
    return;
  }
  if ('ctoggle' in el.dataset) {
    const id = el.closest('.check').dataset.cid;
    const r = await save(t.key, { checklist: t.checklist.map(c => c.id === id ? { ...c, done: el.checked } : c) }); r && renderChecklist(r);
  }
});
document.addEventListener('input', e => {
  const el = e.target, t = openKey && byKey(openKey);
  if (el.id === 'q') { clearTimeout(sTimer); sTimer = setTimeout(runSearch, 160); return; }
  if (el.id === 'agentDir' || el.id === 'agentExtra') { clearTimeout(agentTimer); agentTimer = setTimeout(previewAgent, 250); return; }
  if (!t) return;
  if (el.id === 'dTitle') { autoGrow(el); const v = el.value.replace(/\n/g, ' '); t.title = v; later(t.key, { title: v }); return; }
  if ('cedit' in el.dataset) {
    const id = el.closest('.check').dataset.cid;
    t.checklist = t.checklist.map(c => c.id === id ? { ...c, text: el.value } : c); later(t.key, { checklist: t.checklist });
  }
});
document.addEventListener('keydown', async e => {
  const el = e.target, inField = /INPUT|TEXTAREA|SELECT/.test(el.tagName);
  const t = openKey && byKey(openKey);
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); $('#q').focus(); $('#q').select(); return; }
  if (el.id === 'q') {
    if (e.key === 'ArrowDown') { e.preventDefault(); moveSel(1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); moveSel(-1); }
    else if (e.key === 'Enter') { e.preventDefault(); clearTimeout(sTimer); if (!$('#results').classList.contains('open')) await runSearch(); if (sHits[sSel]) { $('#results').classList.remove('open'); openTicket(sHits[sSel].key); el.blur(); } }
    else if (e.key === 'Escape') { el.value = ''; $('#results').classList.remove('open'); el.blur(); }
    return;
  }
  if (e.key === 'Escape') {
    if ($('#lightbox').classList.contains('open')) { $('#lightbox').classList.remove('open'); return; }
    if (el.id === 'dDescIn' && t) { renderDesc(t); return; }
    const m = $('.modal-bg.open'); if (m) { m.classList.remove('open'); return; }
    if (openKey) { if (inField) el.blur(); closeDrawer(); }
    return;
  }
  if (t && el.id === 'dDescIn' && e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); const r = await save(t.key, { description: el.value }); renderDesc(r || t); return; }
  if (t && el.id === 'dNote' && e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); addNote(t); return; }
  if (t && el.id === 'dTitle' && e.key === 'Enter') { e.preventDefault(); el.blur(); return; }
  if (t && el.id === 'cIn' && e.key === 'Enter' && el.value.trim()) {
    e.preventDefault(); const text = el.value.trim(); el.value = '';
    const r = await save(t.key, { checklist: [...t.checklist, { text, done: false }] }); if (r) { renderChecklist(r); $('#cIn').focus(); } return;
  }
  if (t && 'cedit' in el.dataset && e.key === 'Enter') { e.preventDefault(); el.blur(); return; }
  if (t && el.id === 'lblIn' && (e.key === 'Enter' || e.key === ',') && el.value.trim()) {
    e.preventDefault(); const r = await save(t.key, { labels: [...t.labels, el.value.trim()] }); if (r) { renderDrawerSide(r); $('#lblIn')?.focus(); } return;
  }
  if (t && el.id === 'lblIn' && e.key === 'Backspace' && !el.value && t.labels.length) { const r = await save(t.key, { labels: t.labels.slice(0, -1) }); if (r) { renderDrawerSide(r); $('#lblIn')?.focus(); } return; }
  if (t && (el.id === 'lUrl' || el.id === 'lTitle') && e.key === 'Enter') { e.preventDefault(); addLink(t); return; }
  if (inField || e.metaKey || e.ctrlKey || e.altKey || $('.modal-bg.open')) return;
  if (e.key === '/') { e.preventDefault(); $('#q').focus(); return; }
  if (e.key === 'c' || e.key === 'n') { e.preventDefault(); openNew(); return; }
  if (!openKey && '1234'.includes(e.key)) { view = ['board', 'list', 'library', 'files'][+e.key - 1]; render(); }
});
document.addEventListener('focusout', e => { if (e.target.id === 'dTitle' || 'cedit' in (e.target.dataset || {})) flushPending(); });

// drop / paste files onto the open ticket
document.addEventListener('dragover', e => {
  if (dragKey || !openKey || !e.dataTransfer?.types?.includes('Files')) return;
  e.preventDefault(); $('#dropZone')?.classList.add('over');
});
document.addEventListener('dragleave', e => { if (!e.relatedTarget || !$('#drawer').contains(e.relatedTarget)) $('#dropZone')?.classList.remove('over'); });
document.addEventListener('drop', e => {
  if (dragKey) return;
  if (e.dataTransfer?.files?.length) { e.preventDefault(); $('#dropZone')?.classList.remove('over'); if (openKey) upload(openKey, e.dataTransfer.files); else toast('Open a ticket first, then drop files onto it'); }
});
document.addEventListener('paste', e => {
  if (!openKey) return;
  const files = [...(e.clipboardData?.items || [])].filter(i => i.kind === 'file').map(i => i.getAsFile()).filter(Boolean);
  if (!files.length) return;
  e.preventDefault();
  const stamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-');
  upload(openKey, files.map((f, i) => new File([f], f.name && f.name !== 'image.png' ? f.name : `pasted-${stamp}${i ? '-' + i : ''}.${(f.type.split('/')[1] || 'png').replace('jpeg', 'jpg')}`, { type: f.type })));
});

$('#scrim').addEventListener('click', closeDrawer);
$('#lightbox').addEventListener('click', () => $('#lightbox').classList.remove('open'));
$$('.modal-bg').forEach(m => m.addEventListener('mousedown', e => { if (e.target === m) m.classList.remove('open'); }));
$('#newBtn').addEventListener('click', () => openNew());
$('#setBtn').addEventListener('click', openSettings);
$('#q').addEventListener('focus', () => { if ($('#q').value.trim()) runSearch(); });
window.addEventListener('popstate', () => { const k = location.hash.slice(1); if (k && byKey(k)) openTicket(k, false); else closeDrawer(); });

// theme
function applyTheme() { if (store.get('theme', 'dark') === 'light') document.documentElement.dataset.theme = 'light'; else delete document.documentElement.dataset.theme; }
$('#themeBtn').addEventListener('click', () => {
  store.set('theme', store.get('theme', 'dark') === 'light' ? 'dark' : 'light'); applyTheme();
});
applyTheme();

// Pick up changes made outside the app (the `docket` CLI, Claude sessions, hand edits).
async function refresh() {
  if (document.hidden) return;
  const busy = document.activeElement && /INPUT|TEXTAREA/.test(document.activeElement.tagName) && document.activeElement.closest('#drawer');
  if (busy || pending.size || dragKey) return;
  try {
    if (await load()) {
      render();
      if (openKey) { const t = byKey(openKey); if (t) { if (!$('#dDescIn')) renderDrawer(t); } else closeDrawer(); }
    }
  } catch { /* server restarting */ }
}
setInterval(refresh, 4000);
document.addEventListener('visibilitychange', refresh);

(async () => {
  try { await load(true); } catch (e) { $('#main').innerHTML = `<div class="empty"><h3>Can't reach the Docket server</h3>Open Docket.app again. (${esc(e.message)})</div>`; return; }
  render();
  const k = location.hash.slice(1); if (k && byKey(k)) openTicket(k, false);
})();
</script>
</body>
</html>
